name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # --frozen-lockfile also fails the PR if bun.lock is out of sync with package.json.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      # `build` chains: validate spaces.json -> vue-tsc typecheck -> vite build.
      - name: Build (validate data + typecheck + bundle)
        run: bun run build

      - name: Run tests
        run: bun run test:ci
